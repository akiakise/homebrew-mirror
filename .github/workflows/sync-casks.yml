name: 同步 Homebrew 镜像

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-casks
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: 确认同步代码未变更并检出分支当前版本
        run: |
          git fetch --no-tags origin "$GITHUB_REF"
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows/sync-casks.yml scripts/; then
            echo '分支上的同步代码已更新，请从默认分支重新触发工作流。'
            exit 1
          fi
          git switch --detach FETCH_HEAD
      - name: 同步上游 cask 和允许镜像的安装包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          MIRROR_ALLOWED_CASKS: ${{ vars.MIRROR_ALLOWED_CASKS }}
          MIRROR_PROXY_PREFIX: ${{ vars.MIRROR_PROXY_PREFIX }}
        run: python3 -B scripts/sync_casks.py
      - name: 提交同步结果
        run: |
          git add -- README.md Casks/*.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: 同步 Homebrew cask'
          git push origin "HEAD:$GITHUB_REF"
